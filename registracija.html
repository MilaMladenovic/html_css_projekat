    <section class="registracija-section">
      <h2 class="registracija-naslov">Kreiraj nalog</h2>
      <div class="form-container">
        <form>
          <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input
              type="text"
              name="ime_prezime"
              placeholder="Unesite ime i prezime"
              required
            /><br />
          </div>

          <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input
              type="email"
              name="email"
              placeholder="Unesite Vaš email"
              required
            /><br />
          </div>

          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input
              type="password"
              name="lozinka"
              placeholder="Unesite lozinku"
              required
            /><br />
          </div>

          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input
              type="password"
              name="ponovi_lozinka"
              placeholder="Ponovite lozinku"
              required
            /><br />
          </div>

          <div class="input-group">
            <i class="fa-solid fa-mobile"></i>
            <input
              type="tel"
              name="telefon"
              placeholder="Unesite Vaš broj telefona"
              required
            /><br />
          </div>

          <div class="input-group">
            <i class="fa-solid fa-house"></i>
            <input
              type="text"
              name="adresa"
              placeholder="Unesite Vašu adresu"
              required
            /><br />
          </div>

          <button class="dugme-submit">Registruj se</button>
        </form>

        <p>
          Već imate nalog?
          <a class="prijava-link" href="prijava.html">Kliknite ovde.</a>
        </p>
      </div>
    </section>
  </body>
