      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <script
      src="https://kit.fontawesome.com/a09117d2ed.js"
      crossorigin="anonymous"
    ></script>

    <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon" />

    <link rel="stylesheet" href="css/registracija.css" />
    <link rel="stylesheet" href="css/nav.css" />
  </head>
  <body>
    <header>
      <nav>
        <ul class="nav-links">
          <li><a class="link" href="index.html">Početna</a></li>
          <li><a class="link" href="proizvodi.html">Ponuda</a></li>
          <li><a class="link" href="kategorije.html">Kategorije</a></li>

          <li>
            <a href="index.html"
              ><img src="images/logo.png" alt="Baget & Kroasan Logo"
            /></a>
          </li>

          <li><a class="link" href="o-nama.html">O nama</a></li>
          <li><a class="link" href="kontakt.html">Kontakt</a></li>
          <li>
            <a class="link" href="registracija.html"
              ><i class="fa-solid fa-user"></i
            ></a>
          </li>
          <li>
            <a class="link" href="korpa.html"
              ><i class="fa-solid fa-basket-shopping"></i
            ></a>
          </li>
        </ul>
      </nav>
    </header>

    <section class="registracija-section">
      <h2 class="registracija-naslov">Kreiraj nalog</h2>
      <div class="form-container">
        <form>
          <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input
              type="text"
              name="ime_prezime"
              placeholder="Unesite ime i prezime"
              required
            /><br />
          </div>

          <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input
              type="email"
              name="email"
              placeholder="Unesite Vaš email"
              required
            /><br />
          </div>

          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input
              type="password"
              name="lozinka"
              placeholder="Unesite lozinku"
              required
            /><br />
          </div>

          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input
              type="password"
              name="ponovi_lozinka"
              placeholder="Ponovite lozinku"
              required
            /><br />
          </div>

          <div class="input-group">
            <i class="fa-solid fa-mobile"></i>
            <input
              type="tel"
              name="telefon"
              placeholder="Unesite Vaš broj telefona"
              required
            /><br />
          </div>

          <div class="input-group">
            <i class="fa-solid fa-house"></i>
            <input
              type="text"
              name="adresa"
              placeholder="Unesite Vašu adresu"
              required
            /><br />
          </div>

          <button class="dugme-submit">Registruj se</button>
        </form>

        <p>
          Već imate nalog?
          <a class="prijava-link" href="prijava.html">Kliknite ovde.</a>
        </p>
      </div>
    </section>
  </body>
</html>
